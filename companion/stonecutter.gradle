plugins {
	id 'dev.kikugie.stonecutter'
	id 'net.fabricmc.fabric-loom-remap' version '1.18-SNAPSHOT' apply false
	id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT' apply false
}

stonecutter.active '1.21.11' /* [SC] DO NOT EDIT */

// ./gradlew buildAll: builds every version and copies the jars into the launcher (src-tauri/companion).
tasks.register('buildAll') {
	group = 'anilink'
	dependsOn stonecutter.versions.collect { ":${it.project}:collectJar" }
}
