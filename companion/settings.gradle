pluginManagement {
	repositories {
		maven { name = 'Fabric'; url = 'https://maven.fabricmc.net/' }
		maven { name = 'KikuGie'; url = 'https://maven.kikugie.dev/releases' }
		mavenCentral()
		gradlePluginPortal()
	}
}

plugins {
	id 'dev.kikugie.stonecutter' version '0.10'
}

// Every supported Minecraft version gets its own jar; the code in src/ is kept in the state of vcsVersion.
stonecutter {
	create(rootProject) {
		versions '1.20.1', '1.20.2', '1.20.4', '1.20.6', '1.21.1', '1.21.3', '1.21.4', '1.21.5', '1.21.8', '1.21.10', '1.21.11', '26.1', '26.2', '26.3'
		vcsVersion = '1.21.11'
	}
}

rootProject.name = 'anilink'
