pluginManagement {
	repositories {
		gradlePluginPortal()
		maven { url = 'https://maven.neoforged.net/releases' }
	}
}
rootProject.name = 'anilink-forge'
// srg: Forge 1.20–1.20.4 and NeoForge 1.20.2–1.20.4 (obfuscated names at runtime)
// mojmap: Forge 1.20.6+ and NeoForge 1.20.5+ (Mojang names at runtime), one jar for all of them
include 'srg', 'mojmap'
