[package]
name = "anilauncher"
version = "1.2.1"
description = "AniLauncher"
authors = ["Anidius"]
edition = "2021"

[lib]
name = "anilauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
imagesize = "0.13"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha1 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4", "v3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
regex = "1"
sysinfo = { version = "0.32", default-features = false, features = ["system"] }
discord-rich-presence = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "image-png", "tray-icon", "test"] }
