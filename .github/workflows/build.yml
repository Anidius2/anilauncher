name: Build AniLauncher

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Выпустить версию (например 1.4.0). Пусто — просто собрать установщик, без выпуска"
        required: false
        default: ""
      notes:
        description: "Что нового (одной строкой; подробнее можно дописать потом на странице выпуска)"
        required: false
        default: ""
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      ANILAUNCHER_CLIENT_ID: ${{ vars.MS_CLIENT_ID }}
      ANILAUNCHER_DISCORD_ID: ${{ vars.DISCORD_APP_ID }}
      # where installed launchers look for updates: the releases of this repository
      ANILAUNCHER_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
      RELEASE: ${{ inputs.version != '' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install packages
        run: npm ci

      - name: Set version
        if: inputs.version != ''
        run: node scripts/set-version.mjs "${{ inputs.version }}"

      # A plain build: the installer appears under the run's Artifacts
      - name: Build installer
        if: env.RELEASE != 'true'
        run: npx tauri build

      - uses: actions/upload-artifact@v5
        if: env.RELEASE != 'true'
        with:
          name: AniLauncher-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # A release: signed installer + latest.json on the Releases page, which launchers update from
      - name: Build and publish the release
        if: env.RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: AniLauncher __VERSION__
          releaseBody: ${{ inputs.notes }}
          releaseDraft: false
          prerelease: false
          # signed update files (latest.json) are switched on only for releases
          args: --config src-tauri/tauri.release.conf.json

      # Keep the repository's version in step with the release
      - name: Save the new version in the repository
        if: inputs.version != ''
        # the runner is Windows: PowerShell by default, this script is for bash
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # nothing to commit when the version was already set by hand
          if git commit -am "Версия ${{ inputs.version }}"; then git push; fi
