name: Mod catalog

# Put mod jars into mods-catalog/ and push: this rebuilds catalog.json, which the launcher reads.
on:
  push:
    branches: [main]
    paths: ["mods-catalog/**.jar", "mods-catalog/descriptions.json", "scripts/mods-catalog.mjs"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build catalog.json
        run: node scripts/mods-catalog.mjs
      - name: Save it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add mods-catalog/catalog.json mods-catalog/icons
          git diff --cached --quiet || (git commit -m "Каталог модов" && git push)
